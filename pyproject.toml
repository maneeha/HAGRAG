[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hagrag"
version = "1.0.0"
description = "Hierarchical Attributed Graph Communities based Retrieval-Augmented Generation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.12"
authors = [
  {name = "Maneeha Rani"},
  {name = "Bhupesh Kumar Mishra"},
  {name = "Dhavalkumar Thakker"},
  {name = "Javed Ali Khan"},
]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "torch==2.4.0",
  "transformers==4.44.2",
  "sentence-transformers>=3.0,<4.0",
  "accelerate>=0.33,<2.0",
  "safetensors>=0.4,<1.0",
  "pdfplumber>=0.11,<1.0",
  "neo4j>=5.20,<6.0",
  "networkx>=3.2,<4.0",
  "graspologic>=3.4,<4.0",
  "scikit-learn>=1.4,<2.0",
  "python-louvain>=0.16,<1.0",
  "PyYAML>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
  "pandas>=2.0,<3.0",
  "rouge-score>=0.1.2,<1.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43,<1.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
hagrag = "hagrag.cli:main"

[project.urls]
Repository = "https://github.com/maneeha/HAGRAG"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
